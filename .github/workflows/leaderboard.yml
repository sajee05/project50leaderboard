name: Daily leaderboard
on:
  schedule:
    - cron: "15 18 * * *"   # 18:15 UTC = 11:45 PM IST every day
  workflow_dispatch:         # "Run workflow" button for manual tests

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright google-auth && playwright install --with-deps chromium
      - run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      # Optional: private Telegram alert if a run fails (needs ALERT_CHAT_ID secret)
      - name: Alert on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          if [ -n "$ALERT_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${ALERT_CHAT_ID}" \
              --data-urlencode "text=Leaderboard run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
